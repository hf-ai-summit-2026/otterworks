# Ignored when autoscaling.enabled (the HPA owns the replica count).
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  # Utilization is measured against resources.requests.cpu, so size requests realistically
  # before enabling (see values-10x.yaml).
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# Lets in-flight requests finish: preStop sleep (endpoint removal) + Spring graceful
# shutdown (spring.lifecycle.timeout-per-shutdown-phase=20s).
terminationGracePeriodSeconds: 40
preStopSleepSeconds: 5

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-auth-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: auth-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-service-tls
      hosts:
        - auth-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  # Readiness: DB-aware. Liveness/startup: process-only, so a slow DB never restarts pods.
  path: /health
  livenessPath: /livez
  port: 8081

monitoring:
  enabled: true
  path: /metrics
  port: 8081

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
